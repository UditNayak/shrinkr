apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  annotations:
    # runs before every install and upgrade; Helm waits for it to finish
    "helm.sh/hook": pre-install,pre-upgrade
    # the previous run's Job is deleted when a new one is created
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseSecret }}
                  key: DATABASE_URL
