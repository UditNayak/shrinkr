apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: shrinkr
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: shrinkr:dev
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shrinkr-db
                  key: DATABASE_URL
