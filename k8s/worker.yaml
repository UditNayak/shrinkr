apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: shrinkr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: shrinkr:dev
          command: ["python", "-m", "app.worker"]
          env:
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shrinkr-db
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 192Mi
