apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: shrinkr
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shrinkr
  template:
    metadata:
      labels:
        app: shrinkr
    spec:
      containers:
        - name: app
          image: shrinkr:dev
          ports:
            - containerPort: 8000
          env:
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shrinkr-db
                  key: DATABASE_URL
          # wait before stopping, so the pod is out of the Service before uvicorn exits
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: shrinkr
spec:
  type: NodePort
  selector:
    app: shrinkr
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080
