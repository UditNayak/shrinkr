kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: shrinkr
nodes:
  - role: control-plane
    # Mac ports to NodePorts: the app on 80, and the Argo CD and Grafana UIs,
    # which only listen on 127.0.0.1 so other machines on the network can't reach them
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
      - containerPort: 30443
        hostPort: 8080
        listenAddress: 127.0.0.1
      - containerPort: 30300
        hostPort: 3000
        listenAddress: 127.0.0.1
  - role: worker
  - role: worker
